{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block body %}
<div class="login">
  <section class="login-art" aria-hidden="true">
    <p>Hello</p>
    <p>Xin chào</p>
    <p>你好</p>
    <p>こんにちは</p>
    <p>안녕하세요</p>
  </section>
  <section class="login-form">
    {% for kind, msg in flashes %}<div class="flash {{ kind }}">{{ msg }}</div>{% endfor %}
    <h1>Đăng nhập</h1>
    <p class="sub">Hệ thống quản lý trung tâm ngoại ngữ có tích hợp AI</p>
    {% if error %}<div class="flash bad" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/login" novalidate>
      <label for="username">Tên đăng nhập</label>
      <input id="username" name="username" value="{{ username or '' }}" autocomplete="username" autofocus>
      <label for="password">Mật khẩu</label>
      <input id="password" name="password" type="password" autocomplete="current-password">
      <button type="submit" class="btn">Đăng nhập</button>
    </form>
  </section>
</div>
{% endblock %}
